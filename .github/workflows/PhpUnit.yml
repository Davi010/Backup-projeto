name: Run Backend Tests

on:
  push:
    branches: [ developer, main ]
  pull_request:
    branches: [ developer, main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Start Docker containers
        run: docker compose up -d --build

      - name: Create .env inside container
        run: |
          docker compose exec -T app bash -c "cat > .env <<EOL
          APP_ENV=dev
          APP_KEY=
          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOL"

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies inside container
        run: |
          docker compose exec -T app bash -c "COMPOSER_MEMORY_LIMIT=-1 composer install --no-interaction --prefer-dist --optimize-autoloader --no-scripts --classmap-authoritative || true"

      - name: Generate application key
        run: docker compose exec -T app php artisan key:generate

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Run PHPUnit tests
        run: docker compose exec -T app vendor/bin/phpunit --testdox

      - name: Shutdown Docker containers
        if: always()
        run: docker compose down -v
