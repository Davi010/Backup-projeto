services:

  db:
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    image: mysql:5.7.22
    container_name: db
    restart: unless-stopped
    tty: true
    environment:
      MYSQL_DATABASE: 'ac_manege_db'
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'userpass'
      MYSQL_ROOT_PASSWORD: 'root'
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql/
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    container_name: app
    restart: always
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./app:/app
    networks:
      - app-network
    
  web:
    build:
      context: .
      dockerfile: ./.docker/web/Dockerfile
    container_name: web
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - 8888:80
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: 'root'
    depends_on:
      - db
    networks:
      - app-network

  # Nginx (Web Server)
  nginx:
    build:
      context: .
      dockerfile: ./.docker/nginx/Dockerfile
    container_name: webserver
    restart: unless-stopped
    tty: true
    depends_on:
      app:
        condition: service_started
      web:
        condition: service_started
    ports:
      - 8080:80
      - 5173:5173
    volumes:
      - ./:/var/www
      - web_dist:/web/dist 
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  web_dist:  
    driver: local
  web_node_modules:
    driver: local